<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panchshil Agro - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="text-center mb-3">
      <h3 class="mb-1">Panchshil Agro Agencies</h3>
      <div class="text-muted">Inventory &amp; Credit Management System</div>
    </div>
    <form id="loginForm">
      <div class="mb-2">
        <label class="form-label">Username</label>
        <input class="form-control" id="username" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-success w-100" type="submit">Login</button>
      <div id="loginMsg" class="text-danger small mt-2"></div>
    </form>
    <div class="mt-3 small text-muted">
      Demo: admin/Admin@123 | staff/Staff@123 | accountant/Account@123
    </div>
  </div>
  <script src="/js/login.js"></script>
</body>
</html>
