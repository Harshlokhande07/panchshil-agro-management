<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panchshil Agro - Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <!-- Topbar -->
  <nav class="navbar navbar-expand-lg topbar">
    <div class="container-fluid">
      <span class="navbar-brand text-white mb-0 h5">Panchshil Agro Agencies</span>
      <div class="d-flex align-items-center gap-3">
        <span id="userInfo" class="text-white small"></span>
        <button id="btnLogout" class="btn btn-sm btn-light">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <div class="col-md-2 sidebar p-0">
        <nav class="nav flex-column pt-3">
          <a class="nav-link active" href="#" data-module="dashboard"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
          <a class="nav-link" href="#" data-module="suppliers"><i class="bi bi-truck me-2"></i>Suppliers</a>
          <a class="nav-link" href="#" data-module="products"><i class="bi bi-box-seam me-2"></i>Products</a>
          <a class="nav-link" href="#" data-module="customers"><i class="bi bi-people me-2"></i>Customers</a>
          <a class="nav-link" href="#" data-module="inventory"><i class="bi bi-stack me-2"></i>Inventory</a>
          <a class="nav-link" href="#" data-module="credit"><i class="bi bi-journal-text me-2"></i>Credit (Udhari)</a>
          <a class="nav-link" href="#" data-module="payments"><i class="bi bi-cash-stack me-2"></i>Payments</a>
          <a class="nav-link" href="#" data-module="warranty"><i class="bi bi-shield-check me-2"></i>Warranty</a>
          <a class="nav-link" href="#" data-module="routines"><i class="bi bi-diagram-3 me-2"></i>Views &amp; Routines</a>
          <a class="nav-link admin-only" href="#" data-module="privileges"><i class="bi bi-key me-2"></i>DB Users &amp; Privileges</a>
        </nav>
      </div>

      <!-- Content -->
      <div class="col-md-10 p-4">
        <div id="moduleContainer"></div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
